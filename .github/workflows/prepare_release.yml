name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: Choose Bump Type
        default: patch
        options:
          - major
          - minor
          - patch
          - build

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    concurrency:
      group: prepare-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP_TYPE: ${{ inputs.bump_type }}
    steps:
      - name: Require master
        run: |
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo 'Run Prepare Release on master.' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Prepare version update
        run: |
          flutter pub global activate cider
          cider bump "$BUMP_TYPE" --bump-build
          echo "VERSION_FULL=$(cider version)" >> "$GITHUB_ENV"

      - name: Create version update PR and run CI
        run: |
          branch="release/version-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m "chore(release): bump version to $VERSION_FULL"
          git push origin "$branch"
          pr_url=$(gh pr create --base master --head "$branch" \
            --title "chore(release): bump version to $VERSION_FULL" \
            --body 'Merge this PR after the test check passes, then run Build All on master with the desired target and release-note settings.')
          echo "Release PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run test.yml --ref "$branch"
